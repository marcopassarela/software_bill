<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logísticas Bill</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font:14px Arial,sans-serif}main{width:100%;padding:34px;text-align:center}h1{margin:0 0 7px;font-size:23px}p{margin:0;color:#64748b;line-height:1.5}.mark{width:58px;height:58px;border-radius:17px;margin:0 auto 18px;display:grid;place-items:center;background:#2563eb;color:#fff;font-size:28px;font-weight:700;box-shadow:0 8px 22px #2563eb44}.track{height:9px;margin:26px 0 11px;border-radius:99px;background:#e2e8f0;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:99px;transition:width .25s ease}.percent{font-size:12px;color:#475569}.notes{display:none;margin:20px auto 0;padding:10px;border-radius:10px;background:#eff6ff;color:#1e40af;text-align:left;max-height:60px;overflow:auto;font-size:12px}.spinner{display:inline-block;width:13px;height:13px;margin-right:6px;border:2px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><main><div class="mark">LB</div><h1>Logísticas Bill</h1><p id="message"><span class="spinner"></span>Iniciando…</p><div class="track"><div id="bar" class="bar"></div></div><div id="percent" class="percent">0%</div><div id="notes" class="notes"></div></main>
<script>
window.desktopUpdater.onStatus(({message,progress,notes})=>{document.getElementById('message').innerHTML=message.includes('…')?'<span class="spinner"></span>'+message:message;if(progress!==null&&progress!==undefined){document.getElementById('bar').style.width=Math.max(0,Math.min(100,progress))+'%';document.getElementById('percent').textContent=Math.round(progress)+'%'}if(notes){const n=document.getElementById('notes');n.textContent='O que foi atualizado:\n'+notes;n.style.display='block'}});
</script></body></html>
