<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atualizando…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      width: 440px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
      padding: 32px 28px;
      text-align: center;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    #message {
      font-size: 14px;
      color: #475569;
      margin-bottom: 20px;
      min-height: 40px;
    }
    .bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    #progress {
      height: 100%;
      width: 0%;
      background: #2563eb;
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    #notes {
      font-size: 12px;
      color: #64748b;
      text-align: left;
      max-height: 80px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Logísticas Bill</h1>
    <p id="message">Iniciando…</p>
    <div class="bar"><div id="progress"></div></div>
    <div id="notes"></div>
  </div>
  <script>
    const messageEl = document.getElementById('message');
    const progressEl = document.getElementById('progress');
    const notesEl = document.getElementById('notes');

    if (window.desktop && window.desktop.onUpdateStatus) {
      window.desktop.onUpdateStatus(({ message, progress, notes }) => {
        if (message) messageEl.textContent = message;
        if (typeof progress === 'number') {
          progressEl.style.width = Math.max(0, Math.min(100, progress)) + '%';
        }
        if (notes) notesEl.textContent = notes;
      });
    }
  </script>
</body>
</html>
