name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão a partir da tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build do Next
        run: npm run build

      - name: Conferir standalone
        shell: pwsh
        run: |
          if (-not (Test-Path ".next/standalone/server.js")) { throw "server.js ausente: confira output: 'standalone' no next.config" }
          if (-not (Test-Path ".next/standalone/node_modules/next/package.json")) { throw "next ausente no standalone" }

      - name: Gerar pacote sem publicar (teste)
        run: npx electron-builder --config electron-builder.yml --win --dir --publish never

      - name: Conferir node_modules no pacote
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/win-unpacked/resources/next/node_modules/next/package.json")) { throw "next nao foi para resources/next/node_modules" }

      - name: Gerar instalador e publicar
        run: npx electron-builder --config electron-builder.yml --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}