name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'backend/**'
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Calcular próxima versão
        id: ver
        shell: bash
        run: |
          git fetch --tags --force
          LAST=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          LAST=${LAST:-1.0.0}
          IFS=. read -r MA MI PA <<< "$LAST"
          NEXT="$MA.$MI.$((PA+1))"
          echo "Última: $LAST -> Próxima: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Gerar notas da versão (O que mudou)
        shell: bash
        run: node scripts/make-whatsnew.cjs
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Build do Next
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://logisticasbill.vercel.app/api
          NEXT_PUBLIC_API_BROWSER: https://logisticasbill.vercel.app/api

      - name: Conferir URL da API no build
        shell: pwsh
        run: |
          $js = Get-ChildItem .next/static -Recurse -Include *.js
          $ok = $js | Select-String -Pattern "logisticasbill.vercel.app/api" -SimpleMatch -List
          if (-not $ok) { throw "URL da API (logisticasbill.vercel.app/api) nao foi embutida no build: confira o env do passo Build do Next" }
          Write-Host "URL da API presente no build."

      - name: Conferir standalone
        shell: pwsh
        run: |
          if (-not (Test-Path ".next/standalone/server.js")) { throw "server.js ausente: confira output: 'standalone' no next.config" }
          if (-not (Test-Path ".next/standalone/node_modules/next/package.json")) { throw "next ausente no standalone" }

      - name: Gerar pacote sem publicar (teste)
        run: npx electron-builder --config electron-builder.yml --win --dir --publish never

      - name: Conferir node_modules no pacote
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/win-unpacked/resources/next/node_modules/next/package.json")) { throw "next nao foi para resources/next/node_modules" }

      - name: Gerar instalador e publicar
        run: npx electron-builder --config electron-builder.yml --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}