name: Build e publicar instalador Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão da release
        shell: pwsh
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Compilar aplicação
        run: npm run build

      - name: Gerar e publicar instalador Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:dist -- --publish always
