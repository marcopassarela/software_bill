name: Build instalador Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      BACKEND_URL: https://logisticasbill.vercel.app/api

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação Next.js
        run: npm run build

      - name: Verificar compilação
        shell: pwsh
        run: |
          if (-not (Test-Path ".next/standalone/server.js")) {
            throw "O servidor Next.js standalone não foi gerado."
          }

      - name: Gerar instalador Windows
        run: npx electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Logisticas-Bill-Instalador-Windows
          path: dist/Logisticas-Bill-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

