
name: Build e publicar instalador Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Instalar dependências do backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Verificar estrutura do projeto
        shell: pwsh
        run: |
          Write-Host "Arquivos da raiz:"
          Get-ChildItem
          Write-Host "Arquivos do backend:"
          Get-ChildItem backend

      - name: Guardar arquivos para diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: Logisticas-Bill-arquivos
          path: |
            package.json
            package-lock.json
            backend/
          if-no-files-found: warn
