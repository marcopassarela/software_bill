name: Publicar instalador Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão da release
        id: version
        shell: pwsh
        run: |
          $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          npm version $ver --no-git-tag-version
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Compilar aplicação
        shell: pwsh
        run: |
          npm run build
          $found = @(Get-ChildItem -Recurse .next\standalone -Filter server.js -ErrorAction SilentlyContinue)
          if ($found.Count -eq 0) {
            Write-Error "standalone/server.js nao foi gerado. Verifique output: 'standalone' no next.config"
            Get-ChildItem -Recurse .next -Filter server.js -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            exit 1
          }
          Write-Host "standalone OK"
          $found | ForEach-Object { $_.FullName }

      - name: Gerar instalador Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:dist -- --publish never

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Logísticas Bill v${{ steps.version.outputs.version }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}