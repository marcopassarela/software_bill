name: Publicar instalador Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão da release
        id: version
        shell: pwsh
        run: |
          $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          npm version $ver --no-git-tag-version
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Versao: $ver"

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Compilar aplicação
        shell: pwsh
        run: |
          npm run build
          $server = Get-ChildItem -Recurse .next\standalone -Filter server.js -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $server) {
            Write-Error "standalone/server.js nao foi gerado"
            exit 1
          }
          $nextMod = Join-Path $server.DirectoryName "node_modules\next"
          if (-not (Test-Path $nextMod)) {
            Write-Error "node_modules/next ausente no standalone"
            exit 1
          }
          Write-Host "OK server.js e node_modules/next"

      - name: Gerar instalador Windows
        run: npm run desktop:dist -- --publish never

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Logísticas Bill v${{ steps.version.outputs.version }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}