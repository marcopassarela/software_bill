appId: br.com.logisticasbill.app
productName: Logísticas Bill
copyright: Copyright © 2026 Logísticas Bill

asar: true

directories:
  app: .
  output: dist

files:
  - desktop/**/*
  - package.json
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/sax/**/*
  - node_modules/semver/**/*
  - '!node_modules/.cache/**'
  - '!app/**'
  - '!.next/**'
  - '!backend/**'
  - '!api/**'
  - '!components/**'
  - '!lib/**'
  - '!migrations/**'
  - '!tests/**'
  - '!public/**'

extraResources:
  - from: .next/standalone
    to: next
  - from: .next/static
    to: next/.next/static
  - from: public
    to: next/public

win:
  target:
    - nsis
  artifactName: Logisticas-Bill-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

publish:
  provider: github
  owner: marcopassarela
  repo: software_bill
  releaseType: release