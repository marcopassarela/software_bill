appId: br.com.logisticasbill.app
productName: Logísticas Bill
copyright: Copyright © 2026 Logísticas Bill

asar: true

afterPack: scripts/after-pack.cjs

directories:
  app: .
  output: dist

files:
  - desktop/**/*
  - package.json
  - '!node_modules/.cache/**'
  - '!app/**'
  - '!.next/**'
  - '!backend/**'
  - '!api/**'
  - '!components/**'
  - '!lib/**'
  - '!migrations/**'
  - '!tests/**'
  - '!scripts/**'

extraResources:
  - from: .next/standalone
    to: next
    filter:
      - "**/*"
  - from: .next/static
    to: next/.next/static
  - from: public
    to: next/public

win:
  icon: build/icon2.png
  target:
    - nsis
  artifactName: Logisticas-Bill-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

publish:
  provider: github
  owner: marcopassarela
  repo: software_bill
  releaseType: release
